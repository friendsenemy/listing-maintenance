name: daily maintenance

on:
  schedule:
    # 14:07 UTC ~= 10:07am US Eastern. Off the hour on purpose: scheduled jobs
    # queued exactly on :00 are the ones GitHub delays most under load.
    - cron: "7 14 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write         # needed only to commit the heartbeat

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run maintenance
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python refresh.py

      - name: Keep the repository active
        # GitHub disables scheduled workflows after 60 days without activity.
        # This commit is the whole reason the job is still alive in month three.
        if: always()
        run: |
          git config user.name  "maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add heartbeat.txt || true
          git diff --staged --quiet || git commit -m "heartbeat"
          git push || true
